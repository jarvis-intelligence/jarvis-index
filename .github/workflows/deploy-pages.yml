# Builds the unified Astro + Starlight site (landing at /, docs at /docs/) into a single Pages artifact.
# dist/ IS the artifact — no assembly step.
name: Deploy landing page and docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'design/**'
      - 'astro.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke probe
        run: |
          set -e
          ORIGIN="https://jarvis-intelligence.github.io"
          BASE="$ORIGIN/jarvis-index"
          for path in "/" "/docs/"; do
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" "$BASE$path")
            grep -q "jarvis" /tmp/page.html   # marker: stable string present on both surfaces
            test "$code" = "200"
          done
          # exact failure mode observed 2026-08-21: hashed asset hrefs 404 at the wrong prefix
          curl -s -o /tmp/docs.html "$BASE/docs/"
          grep -E -o 'href="[^"]*(assets|_astro)/[^"]*"' /tmp/docs.html | cut -d'"' -f2 > /tmp/assets.txt
          grep -E -o 'src="[^"]*(assets|_astro)/[^"]*"' /tmp/docs.html | cut -d'"' -f2 >> /tmp/assets.txt
          assets=$(sort -u /tmp/assets.txt)
          test -n "$assets"
          for asset in $assets; do
            case "$asset" in
              http*) url="$asset" ;;
              /*)    url="$ORIGIN$asset" ;;
              *)     url="$BASE/docs/$asset" ;;
            esac
            test "$(curl -s -o /dev/null -w "%{http_code}" "$url")" = "200"
          done
          # sitemap rot regression: every docs loc carries the /docs segment, one deep loc is live-200
          # (Astro/@astrojs/sitemap emits sitemap-index.xml + sitemap-0.xml at the artifact root;
          # the page <loc> URLs live in the sitemap-0.xml chunk.)
          test "$(curl -s -o /tmp/sitemap-0.xml -w "%{http_code}" "$BASE/sitemap-0.xml")" = "200"
          loc_total=$(grep -o '<loc>' /tmp/sitemap-0.xml | wc -l)
          loc_docs=$(grep -o '<loc>[^<]*jarvis-intelligence.github.io/jarvis-index/docs/' /tmp/sitemap-0.xml | wc -l)
          test "$loc_docs" -ge 1
          test "$loc_total" -eq $((loc_docs + 1))   # all docs locs + exactly one landing loc
          deep=$(grep -o '<loc>[^<]*cli/forget[^<]*</loc>' /tmp/sitemap-0.xml | head -1 | sed -e 's/<loc>//' -e 's|</loc>||')
          test -n "$deep"
          test "$(curl -s -o /dev/null -w "%{http_code}" "$deep")" = "200"
