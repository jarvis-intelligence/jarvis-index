# Builds VitePress docs (docs/) and the landing page (site/) into a single Pages artifact.
# Landing page serves at /, docs at /docs/.
name: Deploy landing page and docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress docs
        run: npx vitepress build docs

      - name: Assemble Pages artifact
        run: |
          mkdir -p _artifact/docs
          cp -r site/* _artifact/
          cp -r docs/.vitepress/dist/* _artifact/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _artifact

      - id: deployment
        uses: actions/deploy-pages@v4
